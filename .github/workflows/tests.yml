name: tests

on:
  push:
  pull_request:

jobs:
  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install editable package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

  bridge-build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Build bridge on Windows
        if: runner.os == 'Windows'
        run: .\scripts\windows\build-bridge.ps1
      - name: Validate and build scripts on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          bash -n scripts/macos/build-bridge.sh scripts/macos/test.sh scripts/macos/install-skill.sh
          ./scripts/macos/build-bridge.sh
          ./scripts/macos/install-skill.sh --codex-home "$RUNNER_TEMP/codex" --force
